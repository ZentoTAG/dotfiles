
# ============================================
#  HYPRLOCK — стабильный вариант
# ============================================

background {
    monitor =
    path = /home/zento/data/media/wallpapers/1.png
    blur_passes = 2
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.2
}

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(39, 39, 42, 0.85)
    font_color = #d3d3d3
    rounding = 12
    check_color = rgba(180, 180, 185, 1)
    #placeholder_text = <i><span foreground="#71717a">Пароль...</span></i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(211, 211, 211, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(211, 211, 211, 0.5)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign = center
    valign = center
}
