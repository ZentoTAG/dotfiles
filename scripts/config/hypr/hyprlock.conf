background {
    path = ~/data/media/wallpapers/1.png
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 300, 50

    outline_thickness = 0

    dots_size = 0.30
    dots_space = 0.50
    dots_center = true

    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgb(255, 255, 255)

    placeholder_text = <span foreground="#71717a">Пароль...</span>

    hide_input = false

    rounding = 8

    check_color = rgb(255, 97, 97)
    fail_color = rgb(255, 97, 97)
    fail_transition = 300

    position = 0, -90
    halign = center
    valign = center
}

# Время
label {
    text = cmd[update:1000] date '+%H:%M'

    color = rgb(255,255,255)

    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 90
    halign = center
    valign = center
}

# Дата
label {
    text = cmd[update:1000] LC_TIME=ru_RU.UTF-8 date '+%A, %d %B %Y'

    color = rgba(255,255,255,0.70)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 35
    halign = center
    valign = center
}
