bind = SUPER, Q, exec, kitty
bind = SUPER, Return, exec, kitty
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, E, exec, thunar
bind = ALT, K, exec, hyprshot -m region
bind = ALT, J, exec, hyprshot -m output
bind = SUPER, Print, exec, hyprshot -m window
bind = SUPER, b, exec, kitty --title btop -e btop# Запись экрана OBS
# OBS запись через sendshortcut
bind = ALT, 1, sendshortcut, CTRL, F10, class:com.obsproject.Studio
bind = ALT, 2, sendshortcut, CTRL, F11, class:com.obsproject.Studio

# --- Управление окнами ---
bind = SUPER, C, exec, hyprctl dispatch killactive               # Закрыть окно
bind = SUPER, F, fullscreen                  # Полноэкранный режим
bind = SUPER, S, togglefloating              # Плавающий режим
bind = SUPER, L, exec, hyprlock
# bind = SUPER, W, exec, quickshell --config ~/.config/quickshell/power.qml
bind = SUPER, W, exec, wlogout

# bindm = , mouse:274, movewindow
bind = , mouse:276, submap, mouse

submap = mouse
    # ПКМ закрывает окно (и остаётся в режиме)
    bind = , mouse:273, killactive

    # Выход из режима — только когда отпустишь боковую
    bind = , mouse:276, submap, reset
submap = reset


# --- Навигация (Vim-стиль) ---
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# --- Перемещение окон ---
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# --- Изменение размера окон ---
bind = SUPER CTRL, left, resizeactive, -150 0
bind = SUPER CTRL, right, resizeactive, 150 0
bind = SUPER CTRL, up, resizeactive, 0 -150
bind = SUPER CTRL, down, resizeactive, 0 150

# --- Макеты окон ---
bind = SUPER, T, layoutmsg, togglesplit
bind = SUPER, G, exec, hyprctl keyword general:layout dwindle
bind = SUPER, H, exec, hyprctl keyword general:layout master

# Dwindle layout
dwindle {
    preserve_split = true
    force_split = 2
}

# --- Рабочие столы ---
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# --- Навигация по столам ---
bind = SUPER, TAB, workspace, m+1
bind = SUPER SHIFT, TAB, workspace, m-1

# --- Выход из системы ---
bind = SUPER, X, exec, notify-send "Выход" "Нажми SUPER+SHIFT+Q для выхода"
bind = SUPER SHIFT, Q, exec, hyprctl dispatch exit

# --- Громкость ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
